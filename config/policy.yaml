# AgentGuard policy (T0). M0 keys: the tool registry, confidential globs, internal domains.
# M2 adds directory aliases and high-risk write fields (consumed by the Scope Extractor and
# Action Guard). Later milestones add secret patterns and firewall/guard thresholds.

internal_domains:
  - company.example

confidential_globs:
  - "confidential/**"

# Directory aliases (T0): phrases a user may name instead of an address. The Scope Extractor
# resolves ONLY aliases the user text literally contains; it never invents recipients.
directory:
  "procurement team": procurement@company.example
  "procurement": procurement@company.example
  "finance team": finance@company.example
  "finance": finance@company.example
  "it team": it@company.example
  "legal team": legal@company.example

# Write fields that change money movement or vendor identity. A write that sets one of these to
# a value the user did not literally state is escalated (HIGH_RISK_FIELD -> ASK).
high_risk_fields:
  - bank_account
  - payment_status
  - status
  - contact_email

# M4: secret-shaped data that must never leave through an egress argument (checked independently of
# the taint ledger). SECRET_PATTERN_EGRESS blocks a send/search/write whose args match any of these.
secret_patterns:
  - "CANARY-[A-Z]+-[0-9a-f]{6}"           # canary markers standing in for a leaked secret
  - "sk_(?:test|live)_[A-Za-z0-9_-]{6,}"  # API keys
  - "\\b\\d{4}-FAKE-\\d{4}-\\d{4}\\b"     # bank account numbers (fixture format)
  - "(?:NEW-)?IBAN-[A-Z0-9-]{4,}"         # IBAN-style account identifiers

tools:
  read_file:
    risk: read
    critical_args: [path]
    description: "Read a file from the company document store (e.g. quotes/acme_laptops_quote.txt). Returns its text."
  search_web:
    risk: egress
    critical_args: [query]
    description: "Search the web. Returns the top matching pages with URL, title and text."
  send_email:
    risk: egress
    critical_args: [to]
    description: "Send an email to a single recipient address."
  write_record:
    risk: write
    critical_args: [table, record_id]
    description: "Create or update a record in the procurement database (tables: vendors, purchase_orders)."
