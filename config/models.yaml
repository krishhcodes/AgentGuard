# LLM roles.
# The agent model must be genuinely exploitable (PS3: >= 70% baseline hijack); confirmed at gates D1/D2.
agent:
  provider: groq
  model: openai/gpt-oss-20b
  temperature: 0
  timeout_s: 30
  max_retries: 1

# M2: the Scope Extractor's model. It sees ONLY the trusted user request plus policy tool names
# and directory aliases (invariant P1), so a more robust model here is a feature, not a problem.
scope:
  provider: groq
  model: openai/gpt-oss-20b
  temperature: 0
  timeout_s: 30
  max_retries: 1

# M6: the firewall's F3 instruction classifier. It only ever sees ambiguous spans wrapped in random
# delimiters and must answer strict JSON; a schema violation is itself a signal (FW-CLASSIFIER-ANOMALY).
classifier:
  provider: groq
  model: openai/gpt-oss-20b
  temperature: 0
  timeout_s: 10
  max_retries: 0
  reasoning_effort: low
